# Install to: /etc/systemd/system/vordium-bft.service.d/visor.conf
#
# The visor verifies the release BEFORE the node starts. systemd treats a non-zero
# ExecStartPre as a failed start, so a REFUSE stops the unit — there is deliberately NO '-'
# prefix (that would make every refusal advisory and defeat the design).
#
# The 5th argument is the NAME the SIGNED manifest uses for the node binary (ef49928485806dee).
# Current release: ef49928485806dee (signed manifest SHA256SUMS.ef49928485806dee + .asc). It is stated, not derived from the path, because /opt/vordium/bin/vordiumchain is a symlink
# whose basename is not in the manifest. UPDATE <sha16> WHENEVER YOU INSTALL A NEW RELEASE —
# a stale name yields REFUSE[binary-hash-mismatch-for-name], which is the point.
[Service]
ExecStartPre=/opt/vordium/bin/vordium-visor /opt/vordium/pub_key.asc /opt/vordium/SHA256SUMS.ef49928485806dee /opt/vordium/SHA256SUMS.ef49928485806dee.asc /opt/vordium/bin/ef49928485806dee ef49928485806dee /opt/vordium/genesis.json /opt/vordium/genesis.sha256
