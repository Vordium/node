# Install to: /etc/systemd/system/vordium-bft.service.d/visor.conf
#
# The visor verifies the release BEFORE the node starts. systemd treats a non-zero
# ExecStartPre as a failed start, so a REFUSE stops the unit — there is deliberately NO '-'
# prefix (that would make every refusal advisory and defeat the design).
#
# The 5th argument is the NAME the SIGNED manifest uses for the node binary (0e49718dc0147cfd).
# Current release: 0e49718dc0147cfd (signed manifest SHA256SUMS.0e49718dc0147cfd + .asc). It is stated, not derived from the path, because /opt/vordium/bin/vordiumchain is a symlink
# whose basename is not in the manifest. UPDATE <sha16> WHENEVER YOU INSTALL A NEW RELEASE —
# a stale name yields REFUSE[binary-hash-mismatch-for-name], which is the point.
[Service]
ExecStartPre=/opt/vordium/bin/vordium-visor /opt/vordium/pub_key.asc /opt/vordium/SHA256SUMS.0e49718dc0147cfd /opt/vordium/SHA256SUMS.0e49718dc0147cfd.asc /opt/vordium/bin/0e49718dc0147cfd 0e49718dc0147cfd /opt/vordium/genesis.json /opt/vordium/genesis.sha256
