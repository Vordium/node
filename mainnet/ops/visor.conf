# Install to: /etc/systemd/system/vordium-bft.service.d/visor.conf
#
# The visor verifies the release BEFORE the node starts. systemd treats a non-zero
# ExecStartPre as a failed start, so a REFUSE stops the unit. There is deliberately NO '-'
# prefix (that would make every refusal advisory).
#
# The release the gate checks is named in /opt/vordium/visor-release.env, not in this file:
#   VORDIUM_RELEASE_ID=<sha16>             the name the signed manifest uses for the node binary
# Write it whenever you install a new release or roll back (README, "Updating").
#
# The binary checked is the link systemd actually runs (/opt/vordium/bin/vordiumchain), against
# the manifest line for ${VORDIUM_RELEASE_ID}. If the link and the env file disagree the start is
# refused (binary-hash-mismatch-for-name). The manifest SHA256SUMS.<sha16> + .asc must be in
# /opt/vordium; keep the rollback's manifest there too, so a rollback verifies as well.
#
# No '-' on EnvironmentFile either: a missing file fails the start rather than running unchecked.
[Service]
EnvironmentFile=/opt/vordium/visor-release.env
ExecStartPre=/opt/vordium/bin/vordium-visor /opt/vordium/pub_key.asc /opt/vordium/SHA256SUMS.${VORDIUM_RELEASE_ID} /opt/vordium/SHA256SUMS.${VORDIUM_RELEASE_ID}.asc /opt/vordium/bin/vordiumchain ${VORDIUM_RELEASE_ID} /opt/vordium/config/genesis.json /opt/vordium/genesis.sha256
